---
name: Sophon Blog - Check (formatting, lint), test (run vitest) and build on PR and Merge to main

on: [push, workflow_dispatch]
jobs:
  check_test_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run formatting check
        run: npm run prettier:check
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test

      